# Daily site refresh — runs fully in the cloud, no PC needed.
#   fetch odds -> settle finished matches -> real stats -> screener ->
#   AI copy for new fixtures -> build -> deploy to Cloudflare Pages ->
#   commit the data snapshot back to the repo (history must persist!)
#
# Secrets required (repo Settings -> Secrets and variables -> Actions):
#   ODDS_API_KEY          the-odds-api.com key
#   ANTHROPIC_API_KEY     Claude API key (AI page copy)
#   FOOTBALL_DATA_TOKEN   football-data.org key (form / H2H / standings)
#   CLOUDFLARE_API_TOKEN  token with Cloudflare Pages: Edit
#   CLOUDFLARE_ACCOUNT_ID Cloudflare account id
name: Daily refresh

on:
  schedule:
    - cron: "30 5 * * *"   # 05:30 UTC — after overnight matches finish
    - cron: "30 16 * * *"  # 16:30 UTC — fresh prices before the evening kick-offs
  workflow_dispatch: {}     # manual "Run workflow" button / API trigger

permissions:
  contents: write
  issues: write   # failure alerts open a GitHub issue (mails the owner)

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline deps
        run: pip install -r pipeline/requirements.txt

      # Free historical results for the leagues football-data.org's tier can't
      # cover — this is what lets the goal model price MLS, Argentina and the
      # second divisions. Non-fatal: on any failure the previously committed
      # results-import.json keeps serving and the build proceeds.
      - name: Import football-data.co.uk results
        run: python pipeline/import_fdcouk.py || echo "::warning::fd.co.uk import failed, using last committed data"

      - name: Fetch odds & archive tips
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_REGION: eu
          # 30 leagues x ~4 credits/day ~= 3.7K/month of the 20K paid quota
          # UCL/UEL sit dormant until September - the API returns nothing and
          # fetch_many skips them, then they light up automatically at kickoff
          ODDS_API_SPORTS: soccer_epl,soccer_efl_champ,soccer_spain_la_liga,soccer_italy_serie_a,soccer_germany_bundesliga,soccer_france_ligue_one,soccer_netherlands_eredivisie,soccer_portugal_primeira_liga,soccer_turkey_super_league,soccer_belgium_first_div,soccer_spl,soccer_usa_mls,soccer_brazil_campeonato,soccer_argentina_primera_division,soccer_mexico_ligamx,soccer_denmark_superliga,soccer_sweden_allsvenskan,soccer_uefa_champs_league_qualification,soccer_austria_bundesliga,soccer_switzerland_superleague,soccer_greece_super_league,soccer_poland_ekstraklasa,soccer_norway_eliteserien,soccer_japan_j_league,soccer_korea_kleague1,soccer_germany_bundesliga2,soccer_spain_segunda_division,soccer_england_league1,soccer_uefa_champs_league,soccer_uefa_europa_league
        run: python pipeline/build.py

      - name: Settle finished matches (real scores)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_REGION: eu
        run: python pipeline/results.py

      - name: Fetch standings & season results (football-data.org)
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          ODDS_API_SPORTS: soccer_epl,soccer_efl_champ,soccer_spain_la_liga,soccer_italy_serie_a,soccer_germany_bundesliga,soccer_france_ligue_one,soccer_netherlands_eredivisie,soccer_portugal_primeira_liga,soccer_turkey_super_league,soccer_belgium_first_div,soccer_spl,soccer_usa_mls,soccer_brazil_campeonato,soccer_argentina_primera_division,soccer_mexico_ligamx,soccer_denmark_superliga,soccer_sweden_allsvenskan,soccer_uefa_champs_league_qualification,soccer_austria_bundesliga,soccer_switzerland_superleague,soccer_greece_super_league,soccer_poland_ekstraklasa,soccer_norway_eliteserien,soccer_japan_j_league,soccer_korea_kleague1,soccer_germany_bundesliga2,soccer_spain_segunda_division,soccer_england_league1,soccer_uefa_champs_league,soccer_uefa_europa_league
        run: python pipeline/football_data.py

      - name: Recompute honest tipster stats
        run: python pipeline/stats.py

      - name: Rebuild value screener
        run: python pipeline/screener.py

      - name: AI copy for new fixtures (cached; only new pages cost)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # --limit caps what one run can spend (~150 pages ≈ $2 on Sonnet): a
        # normal day needs 40-80, a backlog clears over a few runs, and no
        # future bug can burn $20+/day again the way the Aug-26 loop did
        run: python pipeline/generate_content.py --limit 150

      - name: Sync data into the site
        run: python pipeline/sync_astro.py

      # This commit MUST happen before build/deploy: when a later step fails
      # (e.g. the 20K-file Pages limit), losing it also loses data/content.json —
      # and the next run re-pays Claude for the same ~400 pages. That exact loop
      # burned ~$23/day between Aug 26 and Sep 2, 2026.
      - name: Commit data snapshot (settled history must persist between runs)
        run: |
          git config user.name "abt-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data src/data public/crests
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "data: scheduled refresh"
          # A local push landing mid-run leaves our ref stale, and a lost push
          # means lost settlements. Rebase onto origin and retry instead of
          # failing the job; data snapshots always rebase cleanly because the
          # bot is the only writer of these paths.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected — rebasing onto origin/main (attempt $attempt)"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "could not push data snapshot after 3 attempts" >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # wrangler requires >= 22
          cache: npm

      - name: Build site
        env:
          # Renders the newsletter form (components/Subscribe.astro). Only set
          # because the KV namespace is bound as SUBSCRIBERS on the Pages
          # project — without that binding /api/subscribe answers 503 and the
          # form must stay hidden. Astro reads this at BUILD time, so the flag
          # lives here and not in the Cloudflare dashboard.
          PUBLIC_NEWSLETTER: "1"
        run: |
          npm ci
          npm run build
          # themed sitemaps: Search Console reports coverage per submitted
          # sitemap, so splitting by page type shows WHICH sections stall
          python pipeline/split_sitemap.py

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name ai-betting-tips --branch main --commit-dirty=true

      # Exit 1 = every batch was rejected. Surface that as a warning rather
      # than failing the job.
      - name: Ping IndexNow (Bing/Yandex instant indexing)
        run: python pipeline/indexnow.py || echo "::warning::IndexNow rejected every batch — see step log"

      # Loud failure. 13 scheduled runs failed in a row (Aug 26 – Sep 2, 2026)
      # and nobody noticed — the site froze and every run re-paid for AI copy.
      # A red run now opens a GitHub issue (or comments on the open one), which
      # mails the repository owner. Close the issue once the cause is fixed.
      - name: Alert on failure (GitHub issue)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/issues"
          open=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$api?state=open&labels=ci-failure&per_page=1" \
            | python -c "import sys,json; d=json.load(sys.stdin); print(d[0]['number'] if d else '')")
          if [ -n "$open" ]; then
            curl -s -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" "$api/$open/comments" \
              -d "{\"body\":\"Daily refresh failed again: $RUN_URL\"}"
          else
            curl -s -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" "$api" \
              -d "{\"title\":\"Daily refresh is failing — site not updating\",\"body\":\"Run: $RUN_URL\\n\\nThe site is not being refreshed. Each failed run still pays for AI copy (capped at 150 pages). Fix the failing step, then close this issue.\",\"labels\":[\"ci-failure\"]}"
          fi
