# Daily site refresh — runs fully in the cloud, no PC needed.
#   fetch odds -> settle finished matches -> real stats -> screener ->
#   AI copy for new fixtures -> build -> deploy to Cloudflare Pages ->
#   commit the data snapshot back to the repo (history must persist!)
#
# Secrets required (repo Settings -> Secrets and variables -> Actions):
#   ODDS_API_KEY          the-odds-api.com key
#   ANTHROPIC_API_KEY     Claude API key (AI page copy)
#   FOOTBALL_DATA_TOKEN   football-data.org key (form / H2H / standings)
#   CLOUDFLARE_API_TOKEN  token with Cloudflare Pages: Edit
#   CLOUDFLARE_ACCOUNT_ID Cloudflare account id
name: Daily refresh

on:
  schedule:
    - cron: "30 5 * * *"   # 05:30 UTC — after overnight matches finish
    - cron: "30 16 * * *"  # 16:30 UTC — fresh prices before the evening kick-offs
  workflow_dispatch: {}     # manual "Run workflow" button / API trigger

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline deps
        run: pip install -r pipeline/requirements.txt

      - name: Fetch odds & archive tips
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_REGION: eu
          # 30 leagues x ~4 credits/day ~= 3.7K/month of the 20K paid quota
          # UCL/UEL sit dormant until September - the API returns nothing and
          # fetch_many skips them, then they light up automatically at kickoff
          ODDS_API_SPORTS: soccer_epl,soccer_efl_champ,soccer_spain_la_liga,soccer_italy_serie_a,soccer_germany_bundesliga,soccer_france_ligue_one,soccer_netherlands_eredivisie,soccer_portugal_primeira_liga,soccer_turkey_super_league,soccer_belgium_first_div,soccer_spl,soccer_usa_mls,soccer_brazil_campeonato,soccer_argentina_primera_division,soccer_mexico_ligamx,soccer_denmark_superliga,soccer_sweden_allsvenskan,soccer_uefa_champs_league_qualification,soccer_austria_bundesliga,soccer_switzerland_superleague,soccer_greece_super_league,soccer_poland_ekstraklasa,soccer_norway_eliteserien,soccer_japan_j_league,soccer_korea_kleague1,soccer_germany_bundesliga2,soccer_spain_segunda_division,soccer_england_league1,soccer_uefa_champs_league,soccer_uefa_europa_league
        run: python pipeline/build.py

      - name: Settle finished matches (real scores)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_REGION: eu
        run: python pipeline/results.py

      - name: Fetch standings & season results (football-data.org)
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          ODDS_API_SPORTS: soccer_epl,soccer_efl_champ,soccer_spain_la_liga,soccer_italy_serie_a,soccer_germany_bundesliga,soccer_france_ligue_one,soccer_netherlands_eredivisie,soccer_portugal_primeira_liga,soccer_turkey_super_league,soccer_belgium_first_div,soccer_spl,soccer_usa_mls,soccer_brazil_campeonato,soccer_argentina_primera_division,soccer_mexico_ligamx,soccer_denmark_superliga,soccer_sweden_allsvenskan,soccer_uefa_champs_league_qualification,soccer_austria_bundesliga,soccer_switzerland_superleague,soccer_greece_super_league,soccer_poland_ekstraklasa,soccer_norway_eliteserien,soccer_japan_j_league,soccer_korea_kleague1,soccer_germany_bundesliga2,soccer_spain_segunda_division,soccer_england_league1,soccer_uefa_champs_league,soccer_uefa_europa_league
        run: python pipeline/football_data.py

      - name: Recompute honest tipster stats
        run: python pipeline/stats.py

      - name: Rebuild value screener
        run: python pipeline/screener.py

      - name: AI copy for new fixtures (cached; only new pages cost)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/generate_content.py

      - name: Sync data into the site
        run: python pipeline/sync_astro.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # wrangler requires >= 22
          cache: npm

      - name: Build site
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name ai-betting-tips --branch main --commit-dirty=true

      - name: Ping IndexNow (Bing/Yandex instant indexing)
        run: python pipeline/indexnow.py

      - name: Commit data snapshot (settled history must persist between runs)
        run: |
          git config user.name "abt-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data src/data public/crests
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "data: scheduled refresh"
          # A local push landing mid-run leaves our ref stale, and a lost push
          # means lost settlements. Rebase onto origin and retry instead of
          # failing the job; data snapshots always rebase cleanly because the
          # bot is the only writer of these paths.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected — rebasing onto origin/main (attempt $attempt)"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "could not push data snapshot after 3 attempts" >&2
          exit 1
